# Mount the Python vq-db (vq-monitor-db, listening on 127.0.0.1:9136) under
# /beta on vqmonitor.sevana.biz, alongside the existing legacy vq-db at /.
#
# Paste these two blocks INSIDE the existing `server { listen 443 ssl; server_name
# vqmonitor.sevana.biz; ... }` block (do NOT add a new server block, and do not
# touch the legacy `location /`). nginx matches the longest path prefix, so
# `/beta/` wins over `/` automatically.
#
# The dashboard build served by :9136 must be built with `--base-href=/beta/`
# (scripts/frontend_build.py --base-href=/beta/) so its assets and API calls
# resolve under /beta. The trailing slash on proxy_pass strips the /beta prefix,
# so /beta/stats -> upstream /stats, /beta/ -> upstream / (the SPA index).

# Redirect the bare /beta to /beta/ so relative asset URLs resolve correctly.
location = /beta {
    return 301 /beta/;
}

location /beta/ {
    proxy_pass http://127.0.0.1:9136/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /beta;

    # /audio streams a WAV and CSV exports can be large: don't buffer, allow time.
    proxy_buffering off;
    proxy_read_timeout 300s;

    # If the backend ever issues a root-absolute redirect (e.g. a StaticFiles
    # directory 307), re-prefix it so the browser stays under /beta:
    proxy_redirect ~^(https?://[^/]+)?(/.*)$ /beta$2;
}
